name: Deploy Spring Boot Application To API Server

on:
  push:
    branches: [ "dev" ] # dev 브랜치에 push 될 때
    tags: [ "v*.*.*" ] # 태그를 붙여 push 될 때(main 브랜치)

jobs:
  build: # Docker 이미지 빌드
    uses: ./.github/workflows/build-image.yml # 재사용 가능한 워크플로우 파일을 호출하여 실행
    with:
      git_ref: ${{ github.ref }} # 현재 이벤트를 발생시킨 git 참조(브랜치 또는 태그)를 빌드 워크플로우에 전달
    secrets: inherit # secrets 전달

  deploy-dev:
    needs: build
    if: github.ref == 'refs/heads/dev' # 현재 이벤트가 'dev' 브랜치에 대한 푸시일 경우에만 실행
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Dev Server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST_DEV }}
          port: ${{ secrets.PORT_DEV }}
          username: ${{ secrets.USERNAME_DEV }}
          key: ${{ secrets.KEY_DEV }} # ppk 파일을 puttygen으로 불러온 후 Conversions -> Export OpenSSH key로 내보내어 Begin 라인부터 End 라인까지 붙여넣음
          passphrase: ${{ secrets.PASSPHRASE_DEV }} # 선택 사항
          script: |
            cd /home/ubuntu/app

#           1.  설정 파일 디렉터리 생성
            mkdir -p ./config
            mkdir -p ./config/ssl
    
#           2. Github Secret 값을 서버에 복사
            echo "${{ secrets.APPLICATION_SECRET }}" | base64 --decode > ./config/application.yml
            echo "${{ secrets.APPLICATION_SECRET_DEV }}" | base64 --decode > ./config/application-dev.yml
            echo "${{ secrets.DEV_KEYSTORE }}" | base64 --decode > ./config/ssl/keystore.p12
            echo "${{ secrets.DEV_ENV }}" | base64 --decode > ./.env
    
#           3. 최신 이미지를 받아와서 서비스 재시작
            docker-compose pull
            docker-compose up -d --remove-orphans
            docker image prune -f

  deploy-main:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') # 현재 이벤트가 'v'로 시작하는 태그 푸시일 경우에만 실행
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code # git 명령어를 실행하기 위해 코드를 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 전체 git 히스토리를 가져와 정확한 브랜치 검증

      - name: Verify tag is on main branch # 푸시된 태그가 main 브랜치에 있는지 검증(dev 브랜치에서 태그를 붙여 배포되는 것을 방지)
        run: |
#           main 브랜치 커밋 목록에 현재 태그가 없으면 grep이 실패하며 잡이 중단됨
          git branch --contains ${{ github.ref_name }} | grep -w 'main'

      - name: Deploy to Main Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST_MAIN }}
          port: ${{ secrets.PORT_MAIN }}
          username: ${{ secrets.USERNAME_MAIN }}
          key: ${{ secrets.PRIVATE_KEY_MAIN }}
#         passphrase: ${{ secrets.PASSPHRASE_MAIN }} # 선택 사항
          script: |
            cd /home/ubuntu/app

#           1.  설정 파일 디렉터리 생성
            mkdir -p ./config
            mkdir -p ./config/ssl
            
#           2. Github Secret 값을 서버에 복사
            echo "${{ secrets.APPLICATION_SECRET }}" | base64 --decode > ./config/application.yml
            echo "${{ secrets.APPLICATION_SECRET_PROD }}" | base64 --decode > ./config/application-prod.yml
            echo "${{ secrets.KEYSTORE_MAIN }}" | base64 --decode > ./config/ssl/keystore.p12
            echo "${{ secrets.ENV_MAIN }}" | base64 --decode > ./.env
            
#           3. 최신 이미지를 받아와서 서비스 재시작
            docker-compose pull
            docker-compose up -d --remove-orphans
            docker image prune -f