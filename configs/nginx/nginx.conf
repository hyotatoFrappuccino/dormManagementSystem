# Spring 백엔드 서버 그룹
upstream spring_server {
    server spring:8080;
}

# Next.js 프론트엔드 서버 그룹
upstream frontend_server {
    server frontend:3000;
}

server {
    listen 80;
    server_name knu-dorm.kro.kr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name knu-dorm.kro.kr;

    ssl_certificate /etc/letsencrypt/live/knu-dorm.kro.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/knu-dorm.kro.kr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # API 요청은 백엔드로 전달
    location ~ ^/(api|oauth2|login)/ {
        proxy_pass http://spring_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 그 외 모든 요청은 프론트엔드로 전달
    location / {
        proxy_pass http://frontend_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
    }
}