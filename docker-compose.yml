services:
  spring:
    image: hyojaelee/dorm:latest
    container_name: spring
    ports:
      - "8080:8080"
    networks:
      - backend
    depends_on:
      - redis
      - prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config/application.yml:/app/config/application.yml
      - ./config/application-dev.yml:/app/config/application-dev.yml
      - ./config/application-prod.yml:/app/config/application-prod.yml
      - ./config/ssl/keystore.p12:/app/config/ssl/keystore.p12
    environment:
      - SPRING_CONFIG_ADDITIONAL-LOCATION=file:/app/config/application.yml, file:/app/config/application-dev.yml, file:/app/config/application-secret-prod.yml

  redis:
    image: redis:latest
    container_name: redis
    restart: always
    networks:
      - backend

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml
      - prom_data:/prometheus
    networks:
      - backend

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    user: "$UID:$GID"
    ports:
      - "3002:3002"
    volumes:
      - ./configs/grafana.ini:/etc/grafana/grafana.ini
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - backend

volumes:
  prom_data:
  grafana-data:

networks:
  backend: